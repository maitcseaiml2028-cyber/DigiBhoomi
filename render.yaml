services:
  - type: web
    name: digibhoomi
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node seed.js && node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: digibhoomi@2026
      - key: PORT
        value: 4000
