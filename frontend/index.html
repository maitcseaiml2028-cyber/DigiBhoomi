<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiBhoomi · Land Acquisition Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* DigiBhoomi palette — warm cream chrome + warm copper/amber accent */
            navy: { 900: '#F5EFE6', 800: '#EDE3D5', 700: '#E5D9C6', 600: '#D9CCB8' },
            brand: { 500: '#B87333', 600: '#9E5F26', 400: '#CC8B4C' },  /* copper */
            amber: { 500: '#D9A441' },                                 /* gold */
            ok: { 500: '#0E9F6E' },                                 /* refined emerald */
            danger: { 500: '#DC3545' },                                 /* refined red */
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            card: '0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06)',
            pop: '0 10px 30px -10px rgba(7,20,38,0.25)',
          }
        }
      }
    }
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- Recharts (needs prop-types) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin="anonymous"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.min.js"></script>

  <style>
    html,
    body,
    #root {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F5F7FA;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Nav sidebar scrollbar dark */
    .sb-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .sb-scroll::-webkit-scrollbar-thumb {
      background: #243b62;
      border-radius: 6px;
    }

    /* Simple slide-in */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .fade-up {
      animation: fadeUp .28s ease-out both;
    }

    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, .45);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .pulse-ring {
      animation: pulseRing 1.8s infinite;
    }

    /* Leaflet tweaks */
    .leaflet-container {
      font-family: 'Outfit', sans-serif;
    }

    .parcel-popup .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 4px;
    }

    .parcel-popup .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
    }

    /* subtle divider */
    .hairline {
      border-color: rgba(15, 23, 42, .08);
    }

    /* focus rings */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #B87333;
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Number tabular */
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react" src="router.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="api.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="services.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="components.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_landing.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_core.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_project.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_gis.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_ai.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_ops.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="pages_roles.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>

</html>
